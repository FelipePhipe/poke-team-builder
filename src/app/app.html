<header class="topbar">
  <h1>PokéTeam Builder & Analyzer</h1>
  <p>Construcción de equipos y análisis de cobertura elemental con PokéAPI</p>
</header>

<main class="contenedor-principal">
  <app-buscador
    [cantidadEquipo]="equipoPokemon().length"
    (agregarPokemon)="agregarAlEquipo($event)"
  ></app-buscador>

  <app-equipo
    [miembros]="equipoPokemon()"
    (eliminarMiembro)="eliminarDelEquipo($event)"
    (limpiarEquipo)="vaciarEquipo()"
  ></app-equipo>
</main>
